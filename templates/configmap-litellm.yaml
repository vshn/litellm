{{- /*If you need templating logic for your model list.*/}}
{{- if .Values.wrapperProxyConfigMap.create }}
{{- $config := deepCopy .Values.litellm.proxy_config }}
{{- if and .Values.litellm.redis.enabled (dig "coordination" "enabled" true .Values.litellm.redis) }}
{{- $generalSettings := (get $config "general_settings") | default dict }}
{{- if not (hasKey $generalSettings "coordination_redis") }}
{{- $coordinationRedis := dict "host" "os.environ/REDIS_HOST" "port" "os.environ/REDIS_PORT" "password" "os.environ/REDIS_PASSWORD" }}
{{- if .Values.litellm.redis.sentinel.enabled }}
{{- $sentinelNode := list (include "litellm.redis.serviceName" .) (include "litellm.redis.port" . | int) }}
{{- $coordinationRedis = dict "sentinel_nodes" (list $sentinelNode) "service_name" (default "mymaster" .Values.litellm.redis.sentinel.masterSet) "password" "os.environ/REDIS_PASSWORD" }}
{{- end }}
{{- $_ := set $generalSettings "coordination_redis" $coordinationRedis }}
{{- $_ := set $config "general_settings" $generalSettings }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
{{- with $config.environment_variables }}
    environment_variables:
{{ toYaml . | indent 6 }}
{{- end }}
{{- with $config.general_settings }}
    general_settings:
{{ toYaml . | indent 6 }}
{{- end }}
{{- with $config.litellm_settings }}
    litellm_settings:
{{ toYaml . | indent 6 }}
{{- end }}
    model_list:
{{- with $config.model_list }}
{{ toYaml . | indent 6 }}
{{- end }}
      - model_name: "chat"
        litellm_params:
          model: "openai/deepseek-v4.1-flash"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "chat+thinking"
        litellm_params:
          model: "openai/deepseek-v4-pro"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "web-research"
        litellm_params:
          model: "openai/deepseek-v4.1-flash"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "fast"
        litellm_params:
          model: "openai/kimi-k2.7-code"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "coding"
        litellm_params:
          model: "openai/deepseek-v4.1-flash"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "coding+thinking"
        litellm_params:
          model: "openai/glm-5.3"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "complex-coding"
        litellm_params:
          model: "openai/kimi-k3.1-pro"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
      - model_name: "embedding"
        litellm_params:
          model: "openai/kimi-k2.7-code"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm
{{- range $model := .Values.wrapperProxyConfigMap.opencodeModels }}
      - model_name: "opencode/{{ $model }}"
        litellm_params:
          model: "openai/{{ $model }}"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_1_API_KEY"
          extra_headers:
            x-opencode-session: litellm

      # for api key rotation without downtime
      - model_name: "opencode/{{ $model }}"
        litellm_params:
          model: "openai/{{ $model }}"
          api_base: "os.environ/OPENCODE_API_BASE"
          api_key: "os.environ/OPENCODE_2_API_KEY"
          extra_headers:
            x-opencode-session: litellm

      - model_name: "opencode-fallback/{{ $model }}"
        litellm_params:
          model: "openai/{{ $model }}"
          api_base: "https://opencode.ai/inference/openai/v1"
          api_key: "os.environ/OPENCODE_3_API_KEY"
          extra_headers:
            x-opencode-session: litellm
{{- end }}
    router_settings:
{{- with $config.router_settings }}
{{ toYaml . | indent 6 }}
{{- end }}
      fallbacks:
{{- range $model := .Values.wrapperProxyConfigMap.opencodeModels }}
        - "opencode/{{ $model }}":
            - "opencode-fallback/{{ $model }}"
{{- end }}
        - "chat":
            - "opencode/deepseek-v4.1-flash"
            - "opencode/deepseek-glm-5.3-flash"
            - "opencode/kimi-k2.7-code"
            - "opencode/qwen-3.8-flash"
            - "claude-haiku-5-5"
        - "chat+thinking":
            - "opencode/deepseek-v4-pro"
            - "opencode/deepseek-glm-5.3"
            - "opencode/qwen-3.8"
        - "web-research":
            - "opencode/kimi-k2.7-code"
            - "minimax-m3.1-flash"
        - "fast":
            - "opencode/kimi-k2.7-code"
            - "minimax-m3.1-flash"
        - "coding":
            - "opencode/deepseek-v4.1-flash"
            - "opencode/deepseek-glm-5.3-flash"
            - "opencode/kimi-k2.7-code"
            - "opencode/qwen-3.8-flash"
            - "claude-haiku-5-5"
        - "coding+thinking":
            - "opencode/deepseek-v4-pro"
            - "opencode/deepseek-glm-5.3"
            - "opencode/qwen-3.8"
        - "complex-coding":
            - "opencode/kimi-k3"
            - "opencode/kimi-k3.1-pro"
        - "embedding":
            - "opencode/kimi-k2.7-code"
            - "minimax-m3.1-flash"
{{- end }}
