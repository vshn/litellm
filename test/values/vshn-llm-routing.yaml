litellm:
  image:
    tag: test
  proxyConfigMap:
    create: false
    # workaround until model discovery of litellm works
    name: litellm-config

  proxy_config:
    litellm_settings:
      # it seems litellm strips the whole path of api_base for model discovery and sends the request to <host>/models
      # this is unusable.
      check_provider_endpoint: false
    model_list:
      - model_name: "openrouter/*"
        litellm_params:
          model: openrouter/*
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: "openrouter-fallback/*"
        litellm_params:
          model: openrouter/*
          api_key: os.environ/OPENROUTER_API_KEY
        model_info:
          discoverable: false
