litellm:
  db:
    deployStandalone: false
    useExisting: true
    secret:
      endpointKey: "endpoint"
  image:
    repository: ghcr.io/berriai/litellm
    pullPolicy: IfNotPresent
    # renovate: datasource=docker depName=ghcr.io/berriai/litellm
    tag: "1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7"
  ingress:
    enabled: false
  serviceAccount:
    create: true
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  proxy_config:
    litellm_settings:
      require_auth_for_metrics_endpoint: false
      success_callback: ["otel"]
      callbacks:
        - prometheus
    environment_variables:
      OTEL_EXPORTER: "console"
      LITELLM_DISABLE_NO_REDIS_WARNING: true
    router_settings: {}
  masterkeySecretName: "runtime-secrets"
  environmentConfigMaps:
    - runtime-env
  environmentSecrets:
    - runtime-secrets

  replicaCount: 2
  serviceMonitor:
    enabled: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    limits:
      cpu: 2
      memory: 3Gi
    requests:
      cpu: 10m
      memory: 1000Mi
  migrationJob:
    hooks:
      helm:
        enabled: true
    securityContext:
      allowPrivilegeEscalation: false
    resources:
      limits:
        memory: 4Gi
      requests:
        memory: 2Gi
ingress:
  enabled: true
  className: "openshift-default"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    haproxy.router.openshift.io/timeout: "20m"
  paths:
    - path: /
      pathType: ImplementationSpecific
    - path: /metrics
      pathType: ImplementationSpecific
      backend:
        service:
          name: nonexistent-service
          port:
            number: 9999
  secretName: litellm-ingress
enableVSHNPostgreSQL: false
generatePostgresSecret: true
prometheusRule:
  enabled: false
  labels: { }
  defaults:
    severity: warning
    for: 5m
    alertLabels: { }
  groups:
    litellm-fallbacks:
      enabled: true
      rules:
        LiteLLMFallbackUsed:
          enabled: true
          expr: |
            sum by (requested_model, fallback_model) (increase(litellm_deployment_successful_fallbacks_total[30m])) > 0
          summary: "LiteLLM served {{ $labels.requested_model }} from fallback model {{ $labels.fallback_model }}"
          description: >-
            Within the last 30m, requests for {{ $labels.requested_model }} were served by the
            fallback deployment {{ $labels.fallback_model }}. The primary deployment likely
            failed (rate limit, outage, cooldown).
        LiteLLMFallbackFailed:
          enabled: true
          expr: |
            sum by (requested_model, fallback_model) (increase(litellm_deployment_failed_fallbacks_total[30m])) > 0
          summary: "LiteLLM fallback for {{ $labels.requested_model }} to {{ $labels.fallback_model }} failed"
          description: >-
            Within the last 30m, falling back from {{ $labels.requested_model }} to
            {{ $labels.fallback_model }} failed ({{ $labels.exception_class }},
            status {{ $labels.exception_status }}).
        LiteLLMDeploymentCooledDown:
          enabled: true
          expr: |
            sum by (litellm_model_name) (increase(litellm_deployment_cooled_down_total[30m])) > 0
          summary: "LiteLLM deployment {{ $labels.litellm_model_name }} was cooled down"
          description: >-
            Within the last 30m, the load balancer cooled down deployment
            {{ $labels.litellm_model_name }} (status {{ $labels.exception_status }}).
wrapperProxyConfigMap:
  create: false
